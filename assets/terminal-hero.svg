<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="100%" height="215">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050812" />
      <stop offset="50%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#0b1122" />
    </linearGradient>

    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#141c30" />
    </linearGradient>

    <filter id="cleanTerminalGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Courier New', monospace;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blinkCursor 0.9s step-end infinite;
    }
  </style>

  <!-- Main Terminal Box -->
  <rect width="900" height="215" rx="12" fill="url(#termBg)" stroke="#1a2438" stroke-width="1.2" />

  <!-- Terminal Top Header Bar -->
  <path d="M 0,12 Q 0,0 12,0 L 888,0 Q 900,0 900,12 L 900,34 L 0,34 Z" fill="url(#termHeader)" />
  <line x1="0" y1="34" x2="900" y2="34" stroke="#1c283f" stroke-width="1" />

  <!-- Window Action Buttons -->
  <circle cx="22" cy="17" r="4.5" fill="#ef4444" opacity="0.85" />
  <circle cx="36" cy="17" r="4.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="50" cy="17" r="4.5" fill="#10b981" opacity="0.85" />

  <!-- Terminal Title -->
  <g transform="translate(450, 21)" text-anchor="middle">
    <text fill="#64748b" class="mono" font-size="11" font-weight="500">
      abhay@quantaforze: ~/core-intelligence (zsh)
    </text>
  </g>

  <!-- Live Branch indicator -->
  <g transform="translate(820, 21)">
    <text fill="#38bdf8" class="mono" font-size="10.5" font-weight="600">⎇ production</text>
  </g>

  <!-- Terminal Body Content -->
  <g transform="translate(26, 60)">
    <!-- Command 1 Prompt -->
    <text x="0" y="0" fill="#38bdf8" class="mono" font-size="13" font-weight="700">❯</text>
    <text x="18" y="0" fill="#f8fafc" class="mono" font-size="13" font-weight="600">quantaforze</text>
    <text x="115" y="0" fill="#64748b" class="mono" font-size="13">--status --inspect</text>

    <!-- Diagnostics Output Block with crisp colors -->
    <g transform="translate(18, 22)">
      <!-- Line 1: Role -->
      <g>
        <text x="0" y="0" fill="#10b981" class="mono" font-size="12" font-weight="bold">✔</text>
        <text x="18" y="0" fill="#94a3b8" class="mono" font-size="12">Venture &amp; Role</text>
        <text x="135" y="0" fill="#475569" class="mono" font-size="12">:</text>
        <text x="150" y="0" fill="#ffffff" class="mono" font-size="12" font-weight="600">Co-Founder @ Quantaforze</text>
      </g>

      <!-- Line 2: AI Focus -->
      <g transform="translate(0, 20)">
        <text x="0" y="0" fill="#10b981" class="mono" font-size="12" font-weight="bold">✔</text>
        <text x="18" y="0" fill="#94a3b8" class="mono" font-size="12">AI Architecture</text>
        <text x="135" y="0" fill="#475569" class="mono" font-size="12">:</text>
        <text x="150" y="0" fill="#38bdf8" class="mono" font-size="12">Agentic Systems · NLP · Deep Learning · Azure AI</text>
      </g>

      <!-- Line 3: Stack -->
      <g transform="translate(0, 40)">
        <text x="0" y="0" fill="#10b981" class="mono" font-size="12" font-weight="bold">✔</text>
        <text x="18" y="0" fill="#94a3b8" class="mono" font-size="12">Engineering</text>
        <text x="135" y="0" fill="#475569" class="mono" font-size="12">:</text>
        <text x="150" y="0" fill="#cbd5e1" class="mono" font-size="12">TypeScript · Next.js · Prisma · Turborepo · Docker</text>
      </g>

      <!-- Line 4: Deployments -->
      <g transform="translate(0, 60)">
        <text x="0" y="0" fill="#10b981" class="mono" font-size="12" font-weight="bold">✔</text>
        <text x="18" y="0" fill="#94a3b8" class="mono" font-size="12">Flagships</text>
        <text x="135" y="0" fill="#475569" class="mono" font-size="12">:</text>
        <text x="150" y="0" fill="#818cf8" class="mono" font-size="12">ConstWare (SaaS) · SocialX (Marketplace) · Itz-Me</text>
      </g>
    </g>

    <!-- Command 2 Prompt with Typing / Rotating Command -->
    <g transform="translate(0, 114)">
      <text x="0" y="0" fill="#38bdf8" class="mono" font-size="13" font-weight="700">❯</text>
      <text x="18" y="0" fill="#38bdf8" class="mono" font-size="13" font-weight="600">run</text>
      
      <!-- Rotating actions in crisp clean white -->
      <g>
        <text x="54" y="0" fill="#f8fafc" class="mono" font-size="13">
          <animate attributeName="opacity" values="1;1;0;0;0;0;1" dur="9s" repeatCount="indefinite" />
          quantaforze --build --product="ConstWare"
        </text>
      </g>
      <g>
        <text x="54" y="0" fill="#f8fafc" class="mono" font-size="13">
          <animate attributeName="opacity" values="0;0;1;1;0;0;0" dur="9s" repeatCount="indefinite" />
          deploy --service="autonomous-agent-orchestrator"
        </text>
      </g>
      <g>
        <text x="54" y="0" fill="#f8fafc" class="mono" font-size="13">
          <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="9s" repeatCount="indefinite" />
          benchmark --target="production-grade-microservices"
        </text>
      </g>

      <!-- Glowing Cyan Terminal Cursor -->
      <rect x="495" y="-12" width="8" height="15" fill="#38bdf8" class="cursor" filter="url(#cleanTerminalGlow)" />
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="100%" height="215">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>

    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#131926" />
      <stop offset="100%" stop-color="#171e2e" />
    </linearGradient>

    <filter id="terminalGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Courier New', monospace;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .cursor {
      animation: blinkCursor 0.9s step-end infinite;
    }
  </style>

  <!-- Main Terminal Box -->
  <rect width="900" height="215" rx="12" fill="url(#termBg)" stroke="#1f293d" stroke-width="1.2" />

  <!-- Terminal Top Header Bar -->
  <path d="M 0,12 Q 0,0 12,0 L 888,0 Q 900,0 900,12 L 900,34 L 0,34 Z" fill="url(#termHeader)" />
  <line x1="0" y1="34" x2="900" y2="34" stroke="#222c40" stroke-width="1" />

  <!-- Window Action Buttons -->
  <circle cx="22" cy="17" r="5" fill="#ff5f56" />
  <circle cx="38" cy="17" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="17" r="5" fill="#27c93f" />

  <!-- Terminal Title -->
  <g transform="translate(450, 21)" text-anchor="middle">
    <text fill="#64748b" class="mono" font-size="11.5" font-weight="500">
      abhay@macbook-pro: ~/developer-matrix (zsh)
    </text>
  </g>

  <!-- Live Branch indicator -->
  <g transform="translate(810, 21)">
    <text fill="#a855f7" class="mono" font-size="11" font-weight="600">⎇ main*</text>
  </g>

  <!-- Terminal Body Content -->
  <g transform="translate(24, 60)">
    <!-- Command 1 Prompt -->
    <text x="0" y="0" fill="#38bdf8" class="mono" font-size="13" font-weight="700">❯</text>
    <text x="18" y="0" fill="#c9a84c" class="mono" font-size="13" font-weight="600">codeorbit</text>
    <text x="98" y="0" fill="#e2e8f0" class="mono" font-size="13">--diagnostics --verbose</text>

    <!-- Diagnostics Output Block with animated checkmarks -->
    <g transform="translate(18, 22)">
      <!-- Line 1: Core AI -->
      <g>
        <text x="0" y="0" fill="#10b981" class="mono" font-size="12.5" font-weight="bold">✔</text>
        <text x="18" y="0" fill="#94a3b8" class="mono" font-size="12.5">AI Engine</text>
        <text x="120" y="0" fill="#64748b" class="mono" font-size="12.5">:</text>
        <text x="135" y="0" fill="#f1f5f9" class="mono" font-size="12.5">Agentic Workflows · NLP · Deep Learning · Azure AI</text>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
      </g>

      <!-- Line 2: Stack -->
      <g transform="translate(0, 20)">
        <text x="0" y="0" fill="#10b981" class="mono" font-size="12.5" font-weight="bold">✔</text>
        <text x="18" y="0" fill="#94a3b8" class="mono" font-size="12.5">Engineering</text>
        <text x="120" y="0" fill="#64748b" class="mono" font-size="12.5">:</text>
        <text x="135" y="0" fill="#38bdf8" class="mono" font-size="12.5">TypeScript · Next.js · Express · Prisma · Docker · Turborepo</text>
      </g>

      <!-- Line 3: Live Deployments -->
      <g transform="translate(0, 40)">
        <text x="0" y="0" fill="#10b981" class="mono" font-size="12.5" font-weight="bold">✔</text>
        <text x="18" y="0" fill="#94a3b8" class="mono" font-size="12.5">Deployments</text>
        <text x="120" y="0" fill="#64748b" class="mono" font-size="12.5">:</text>
        <text x="135" y="0" fill="#c084fc" class="mono" font-size="12.5">ConstWare (SaaS) · SocialX (Marketplace) · Itz-Me</text>
      </g>

      <!-- Line 4: System State -->
      <g transform="translate(0, 60)">
        <text x="0" y="0" fill="#10b981" class="mono" font-size="12.5" font-weight="bold">✔</text>
        <text x="18" y="0" fill="#94a3b8" class="mono" font-size="12.5">Availability</text>
        <text x="120" y="0" fill="#64748b" class="mono" font-size="12.5">:</text>
        <text x="135" y="0" fill="#fde047" class="mono" font-size="12.5" font-weight="600">READY TO BUILD &amp; COLLABORATE (Full-Stack / AI)</text>
      </g>
    </g>

    <!-- Command 2 Prompt with Typing / Blinking Cursor -->
    <g transform="translate(0, 114)">
      <text x="0" y="0" fill="#38bdf8" class="mono" font-size="13" font-weight="700">❯</text>
      <text x="18" y="0" fill="#7c6aef" class="mono" font-size="13" font-weight="600">run</text>
      
      <!-- Animated rotating action text -->
      <g>
        <text x="52" y="0" fill="#e2e8f0" class="mono" font-size="13">
          <animate attributeName="opacity" values="1;1;0;0;0;0;1" dur="9s" repeatCount="indefinite" />
          build --product="ConstWare" --monorepo=turbo
        </text>
      </g>
      <g>
        <text x="52" y="0" fill="#e2e8f0" class="mono" font-size="13">
          <animate attributeName="opacity" values="0;0;1;1;0;0;0" dur="9s" repeatCount="indefinite" />
          deploy --agent="Autonomous AI Orchestrator"
        </text>
      </g>
      <g>
        <text x="52" y="0" fill="#e2e8f0" class="mono" font-size="13">
          <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="9s" repeatCount="indefinite" />
          launch --target="Production Ready Systems"
        </text>
      </g>

      <!-- Glowing Blinking Terminal Cursor -->
      <rect x="445" y="-12" width="8" height="15" fill="#38bdf8" class="cursor" filter="url(#terminalGlow)">
        <animate attributeName="fill" values="#38bdf8; #c9a84c; #a855f7; #38bdf8" dur="6s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>

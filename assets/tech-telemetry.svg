<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 155" width="100%" height="155">
  <defs>
    <!-- Base Card Gradient -->
    <linearGradient id="telemetryCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0a1022" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <!-- Traveling Laser for Telemetry Border -->
    <linearGradient id="telemetryBorderLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="telemetryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Equalizer Gradients -->
    <linearGradient id="eqCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="eqIndigo" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Monaco', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .radar-needle {
      transform-origin: 16px 14px;
      animation: radarSpin 2.5s linear infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="920" height="155" rx="14" fill="#04060f" stroke="#162035" stroke-width="1.2" />

  <!-- Animated Perimeter Laser running around container -->
  <rect width="920" height="155" rx="14" fill="none" stroke="url(#telemetryBorderLaser)" stroke-width="1.5" stroke-dasharray="100 2000" filter="url(#telemetryGlow)">
    <animate attributeName="stroke-dashoffset" values="0; -2100" dur="7s" repeatCount="indefinite" />
  </rect>

  <!-- ==================== PANEL 1: AI & AGENTIC ARCHITECTURE ==================== -->
  <g transform="translate(18, 14)">
    <rect width="276" height="127" rx="10" fill="url(#telemetryCardBg)" stroke="#1a253b" stroke-width="1" />
    
    <!-- Top Bar with Pulsing Sonar Dot -->
    <g transform="translate(16, 20)">
      <circle cx="0" cy="0" r="3" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="6.5" fill="none" stroke="#38bdf8" stroke-width="0.8">
        <animate attributeName="r" values="3;9;3" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="14" y="3.5" fill="#38bdf8" class="mono" font-size="10" font-weight="700" letter-spacing="1">
        AI &amp; AGENTIC ARCHITECTURE
      </text>
    </g>

    <!-- Animated Neural Synaptic Frequency Wave -->
    <g transform="translate(16, 44)">
      <line x1="0" y1="15" x2="244" y2="15" stroke="#162134" stroke-width="1" stroke-dasharray="3,3" />
      
      <!-- Primary Wave -->
      <path fill="none" stroke="#38bdf8" stroke-width="1.8" filter="url(#telemetryGlow)">
        <animate attributeName="d"
          values="
            M 0,15 Q 30,0 60,15 T 120,15 T 160,-4 T 180,32 T 200,15 T 244,15;
            M 0,15 Q 30,30 60,15 T 120,15 T 160,34 T 180,-2 T 200,15 T 244,15;
            M 0,15 Q 30,0 60,15 T 120,15 T 160,-4 T 180,32 T 200,15 T 244,15
          "
          dur="3s"
          repeatCount="indefinite"
        />
      </path>

      <!-- Synaptic Impulse Packet Traveling Along the Wire -->
      <circle r="2.5" fill="#ffffff" filter="url(#telemetryGlow)">
        <animateMotion path="M 0,15 L 244,15" dur="2.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Subtitle & Focus tags -->
    <text x="16" y="94" fill="#f1f5f9" class="sans" font-size="11.5" font-weight="600">NLP · Deep Learning · Azure AI</text>
    <g transform="translate(16, 112)">
      <text fill="#64748b" class="mono" font-size="9.5">NEURAL CORE: ONLINE</text>
      <text x="170" y="0" fill="#34d399" class="mono" font-size="9.5" font-weight="bold">99.8% INFERENCE</text>
    </g>
  </g>

  <!-- ==================== PANEL 2: HIGH-THROUGHPUT MONOREPO ==================== -->
  <g transform="translate(312, 14)">
    <rect width="296" height="127" rx="10" fill="url(#telemetryCardBg)" stroke="#1a253b" stroke-width="1" />
    
    <!-- Top Bar -->
    <g transform="translate(16, 20)">
      <circle cx="0" cy="0" r="3" fill="#818cf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="6.5" fill="none" stroke="#818cf8" stroke-width="0.8">
        <animate attributeName="r" values="3;9;3" dur="2.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="14" y="3.5" fill="#818cf8" class="mono" font-size="10" font-weight="700" letter-spacing="1">
        HIGH-THROUGHPUT MONOREPO
      </text>
    </g>

    <!-- Animated Data Throughput Stream Channels -->
    <g transform="translate(16, 44)">
      <!-- Channel 1: Web & API Microservices -->
      <rect x="0" y="2" width="264" height="4.5" rx="2.2" fill="#131d2e" />
      <rect x="0" y="2" width="160" height="4.5" rx="2.2" fill="url(#eqCyan)">
        <animate attributeName="width" values="50;240;110;260;160" dur="4s" repeatCount="indefinite" />
      </rect>
      <!-- Moving Packet Bit 1 -->
      <circle cy="4.2" r="2" fill="#ffffff">
        <animate attributeName="cx" values="0;264" dur="1.8s" repeatCount="indefinite" />
      </circle>

      <!-- Channel 2: Data Pipeline -->
      <rect x="0" y="16" width="264" height="4.5" rx="2.2" fill="#131d2e" />
      <rect x="0" y="16" width="190" height="4.5" rx="2.2" fill="url(#eqIndigo)">
        <animate attributeName="width" values="190;80;250;130;190" dur="4.6s" repeatCount="indefinite" />
      </rect>
      <!-- Moving Packet Bit 2 (reverse flow) -->
      <circle cy="18.2" r="2" fill="#38bdf8">
        <animate attributeName="cx" values="264;0" dur="2.4s" repeatCount="indefinite" />
      </circle>
    </g>

    <text x="16" y="94" fill="#f1f5f9" class="sans" font-size="11.5" font-weight="600">Turborepo · Next.js · Prisma</text>
    <g transform="translate(16, 112)">
      <text fill="#64748b" class="mono" font-size="9.5">BUILD LATENCY: &lt;14ms</text>
      <text x="180" y="0" fill="#38bdf8" class="mono" font-size="9.5" font-weight="bold">TURBO SYNC</text>
    </g>
  </g>

  <!-- ==================== PANEL 3: CLOUD & CONTAINER RETICLE ==================== -->
  <g transform="translate(626, 14)">
    <rect width="276" height="127" rx="10" fill="url(#telemetryCardBg)" stroke="#1a253b" stroke-width="1" />
    
    <!-- Top Bar -->
    <g transform="translate(16, 20)">
      <circle cx="0" cy="0" r="3" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="6.5" fill="none" stroke="#38bdf8" stroke-width="0.8">
        <animate attributeName="r" values="3;9;3" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="14" y="3.5" fill="#38bdf8" class="mono" font-size="10" font-weight="700" letter-spacing="1">
        CLOUD &amp; CONTAINER CLUSTER
      </text>
    </g>

    <!-- Animated Dual-Ring Radar Reticle -->
    <g transform="translate(16, 42)">
      <g transform="translate(16, 14)">
        <circle cx="0" cy="0" r="15" fill="#0b1322" stroke="#1c2b42" stroke-width="1" />
        <circle cx="0" cy="0" r="8" fill="none" stroke="#1c2b42" stroke-width="0.7" stroke-dasharray="2,2" />
        
        <!-- Target Ping Blip -->
        <circle cx="6" cy="-5" r="2" fill="#34d399">
          <animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" repeatCount="indefinite" />
        </circle>
        
        <!-- Radar Sweep Needle -->
        <g class="radar-needle" transform="translate(-16, -14)">
          <line x1="16" y1="14" x2="31" y2="14" stroke="#38bdf8" stroke-width="1.6" filter="url(#telemetryGlow)" />
        </g>
      </g>
      
      <text x="42" y="10" fill="#f1f5f9" class="sans" font-size="11.5" font-weight="600">Docker · Supabase · Vite</text>
      <text x="42" y="26" fill="#64748b" class="mono" font-size="9.5">CONTAINERS: 100% HEALTHY</text>
    </g>

    <g transform="translate(16, 112)">
      <text fill="#64748b" class="mono" font-size="9.5">ORCHESTRATION: NOMINAL</text>
      <text x="160" y="0" fill="#34d399" class="mono" font-size="9.5" font-weight="bold">ACTIVE 24/7</text>
    </g>
  </g>
</svg>

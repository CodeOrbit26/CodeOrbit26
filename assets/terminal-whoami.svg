<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="380">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#070c1b" />
      <stop offset="100%" stop-color="#0a1024" />
    </linearGradient>

    <!-- Header Bar Gradient -->
    <linearGradient id="termHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c1426" />
      <stop offset="100%" stop-color="#121c33" />
    </linearGradient>

    <!-- Traveling Laser for Terminal Perimeter -->
    <linearGradient id="termBorderLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="termGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Courier New', monospace;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blinkCursor 0.9s step-end infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="920" height="380" rx="14" fill="url(#termBgGrad)" stroke="#162035" stroke-width="1.2" />

  <!-- Animated Traveling Laser Beam around Terminal -->
  <rect width="920" height="380" rx="14" fill="none" stroke="url(#termBorderLaser)" stroke-width="1.5" stroke-dasharray="140 2600" filter="url(#termGlow)">
    <animate attributeName="stroke-dashoffset" values="0; -2740" dur="7.5s" repeatCount="indefinite" />
  </rect>

  <!-- Terminal Header Bar -->
  <path d="M 0,14 Q 0,0 14,0 L 906,0 Q 920,0 920,14 L 920,36 L 0,36 Z" fill="url(#termHeaderGrad)" />
  <line x1="0" y1="36" x2="920" y2="36" stroke="#1a273f" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="18" r="4.5" fill="#ef4444" opacity="0.9" />
  <circle cx="39" cy="18" r="4.5" fill="#f59e0b" opacity="0.9" />
  <circle cx="54" cy="18" r="4.5" fill="#10b981" opacity="0.9" />

  <!-- Title Center -->
  <g transform="translate(460, 22)" text-anchor="middle">
    <text fill="#64748b" class="mono" font-size="11" font-weight="600">
      abhay@quantaforze-core: ~/whoami.py (python3)
    </text>
  </g>

  <!-- Right Git Status Pill -->
  <g transform="translate(815, 14)">
    <rect width="86" height="18" rx="9" fill="#08101e" stroke="#1e2c44" stroke-width="1" />
    <circle cx="12" cy="9" r="2.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="12.5" fill="#38bdf8" class="mono" font-size="9.5" font-weight="700">⎇ main*</text>
  </g>

  <!-- ==================== TERMINAL CONTENT BODY ==================== -->
  <g transform="translate(28, 62)">
    <!-- Command Prompt: python3 whoami.py -->
    <text x="0" y="0" fill="#38bdf8" class="mono" font-size="13" font-weight="700">❯</text>
    <text x="18" y="0" fill="#ffffff" class="mono" font-size="13" font-weight="600">python3</text>
    <text x="82" y="0" fill="#cbd5e1" class="mono" font-size="13">whoami.py</text>

    <!-- Python Code Definition -->
    <g transform="translate(0, 26)">
      <!-- Line 1: abhay = { -->
      <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12.5" font-weight="600">abhay</text>
      <text x="48" y="0" fill="#cbd5e1" class="mono" font-size="12.5">=</text>
      <text x="64" y="0" fill="#f8fafc" class="mono" font-size="12.5">{</text>

      <!-- Line 2: "name" -->
      <g transform="translate(20, 20)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12">"name"</text>
        <text x="50" y="0" fill="#64748b" class="mono" font-size="12">:</text>
        <text x="65" y="0" fill="#ffffff" class="mono" font-size="12" font-weight="600">"Abhay Gupta"</text>
        <text x="165" y="0" fill="#64748b" class="mono" font-size="12">,</text>
      </g>

      <!-- Line 3: "handle" -->
      <g transform="translate(20, 40)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12">"handle"</text>
        <text x="62" y="0" fill="#64748b" class="mono" font-size="12">:</text>
        <text x="77" y="0" fill="#cbd5e1" class="mono" font-size="12">"CodeOrbit26"</text>
        <text x="175" y="0" fill="#64748b" class="mono" font-size="12">,</text>
      </g>

      <!-- Line 4: "role" -->
      <g transform="translate(20, 60)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12">"role"</text>
        <text x="48" y="0" fill="#64748b" class="mono" font-size="12">:</text>
        <text x="63" y="0" fill="#ffffff" class="mono" font-size="12" font-weight="600">"Co-Founder @ Quantaforze"</text>
        <text x="270" y="0" fill="#64748b" class="mono" font-size="12">,</text>
      </g>

      <!-- Line 5: "discipline" -->
      <g transform="translate(20, 80)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12">"discipline"</text>
        <text x="96" y="0" fill="#64748b" class="mono" font-size="12">:</text>
        <text x="111" y="0" fill="#38bdf8" class="mono" font-size="12">"AI/ML Systems &amp; Full-Stack Architect"</text>
        <text x="415" y="0" fill="#64748b" class="mono" font-size="12">,</text>
      </g>

      <!-- Line 6: "focus" -->
      <g transform="translate(20, 100)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12">"focus"</text>
        <text x="54" y="0" fill="#64748b" class="mono" font-size="12">:</text>
        <text x="69" y="0" fill="#cbd5e1" class="mono" font-size="12">["Agentic AI", "NLP", "Deep Learning", "Azure AI"]</text>
        <text x="495" y="0" fill="#64748b" class="mono" font-size="12">,</text>
      </g>

      <!-- Line 7: "stack" -->
      <g transform="translate(20, 120)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12">"stack"</text>
        <text x="54" y="0" fill="#64748b" class="mono" font-size="12">:</text>
        <text x="69" y="0" fill="#818cf8" class="mono" font-size="12">["Python", "TypeScript", "Next.js", "Prisma", "Docker", "Supabase"]</text>
        <text x="635" y="0" fill="#64748b" class="mono" font-size="12">,</text>
      </g>

      <!-- Line 8: "architecture" -->
      <g transform="translate(20, 140)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12">"architecture"</text>
        <text x="118" y="0" fill="#64748b" class="mono" font-size="12">:</text>
        <text x="133" y="0" fill="#cbd5e1" class="mono" font-size="12">"Turborepo Monorepos &amp; Scalable Microservices"</text>
        <text x="505" y="0" fill="#64748b" class="mono" font-size="12">,</text>
      </g>

      <!-- Line 9: "flagships" -->
      <g transform="translate(20, 160)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12">"flagships"</text>
        <text x="86" y="0" fill="#64748b" class="mono" font-size="12">:</text>
        <text x="101" y="0" fill="#818cf8" class="mono" font-size="12">["ConstWare (SaaS)", "SocialX (Marketplace)", "Itz-Me"]</text>
        <text x="560" y="0" fill="#64748b" class="mono" font-size="12">,</text>
      </g>

      <!-- Line 10: "status" -->
      <g transform="translate(20, 180)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12">"status"</text>
        <text x="60" y="0" fill="#64748b" class="mono" font-size="12">:</text>
        <text x="75" y="0" fill="#cbd5e1" class="mono" font-size="12">"Building autonomous systems &amp; scaling Quantaforze"</text>
        <text x="495" y="0" fill="#64748b" class="mono" font-size="12">,</text>
      </g>

      <!-- Line 11: "portfolio" -->
      <g transform="translate(20, 200)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12">"portfolio"</text>
        <text x="82" y="0" fill="#64748b" class="mono" font-size="12">:</text>
        <text x="97" y="0" fill="#38bdf8" class="mono" font-size="12">"https://abhayanaiengineer.vercel.app"</text>
        <text x="420" y="0" fill="#64748b" class="mono" font-size="12">,</text>
      </g>

      <!-- Line 12: "open_to_collaborate" -->
      <g transform="translate(20, 220)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12">"open_to_collaborate"</text>
        <text x="175" y="0" fill="#64748b" class="mono" font-size="12">:</text>
        <text x="190" y="0" fill="#34d399" class="mono" font-size="12" font-weight="bold">True</text>
        <text x="225" y="0" fill="#64748b" class="mono" font-size="12">,</text>
      </g>

      <!-- Line 13: } -->
      <text x="0" y="244" fill="#f8fafc" class="mono" font-size="12.5">}</text>
    </g>

    <!-- Trailing Active Terminal Prompt with Blinking Cursor -->
    <g transform="translate(0, 296)">
      <text x="0" y="0" fill="#38bdf8" class="mono" font-size="13" font-weight="700">❯</text>
      <text x="18" y="0" fill="#64748b" class="mono" font-size="12">system: ready for deployment</text>
      <!-- Blinking Cyan Cursor -->
      <rect x="250" y="-12" width="8" height="15" fill="#38bdf8" class="cursor" filter="url(#termGlow)" />
    </g>
  </g>
</svg>

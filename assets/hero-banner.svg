<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="230">
  <defs>
    <!-- Background Gradient: Seamlessly anchored in GitHub's #0d1117 dark canvas -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="25%" stop-color="#090f1d" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="75%" stop-color="#090f1d" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Edge Vignette Blends (Dissolve to #0d1117 seamlessly on all 4 sides) -->
    <linearGradient id="bottomBlend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="40%" stop-color="#0d1117" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#0d1117" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="topBlend" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="70%" stop-color="#0d1117" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="leftBlend" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="75%" stop-color="#0d1117" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="rightBlend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="75%" stop-color="#0d1117" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>

    <!-- Soft Ambient Quantum Aurora Gradients -->
    <radialGradient id="auroraCyan" cx="22%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.14">
        <animate attributeName="stop-opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite" />
        <animate attributeName="cx" values="22%;26%;22%" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraIndigo" cx="78%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15">
        <animate attributeName="stop-opacity" values="0.09;0.20;0.09" dur="7s" repeatCount="indefinite" />
        <animate attributeName="cx" values="78%;73%;78%" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <!-- Flowing Wave Gradients (Fade vertically into #0d1117 at bottom) -->
    <linearGradient id="waveCyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waveIndigoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>

    <!-- Crisp Laser Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
    }
    .mono {
      font-family: "SF Mono", "Fira Code", "Monaco", "Courier New", monospace;
    }
    .hero-title {
      font-weight: 800;
      letter-spacing: 5px;
    }
    @keyframes orbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbitSpinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .orbital-1 {
      transform-origin: 460px 115px;
      animation: orbitSpin 35s linear infinite;
    }
    .orbital-2 {
      transform-origin: 460px 115px;
      animation: orbitSpinReverse 48s linear infinite;
    }
  </style>

  <!-- ==================== BASE CANVAS ==================== -->
  <rect width="920" height="230" fill="#0d1117" />
  <rect width="920" height="230" fill="url(#canvasBg)" />

  <!-- Ambient Aurora Glows -->
  <rect width="920" height="230" fill="url(#auroraCyan)" />
  <rect width="920" height="230" fill="url(#auroraIndigo)" />

  <!-- Animated Quantum Orbital Constellation Gyroscope (Core Background) -->
  <g opacity="0.15">
    <ellipse cx="460" cy="115" rx="280" ry="70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,8" class="orbital-1" />
    <ellipse cx="460" cy="115" rx="310" ry="80" fill="none" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="4,6" class="orbital-2" />
    
    <!-- Rotating satellite photon beads -->
    <g class="orbital-1">
      <circle cx="180" cy="115" r="2.5" fill="#00f0ff" opacity="0.8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="740" cy="115" r="2" fill="#ffffff" opacity="0.7" />
    </g>
    <g class="orbital-2">
      <circle cx="460" cy="35" r="2.5" fill="#818cf8" opacity="0.8" />
      <circle cx="460" cy="195" r="2" fill="#38bdf8" opacity="0.7" />
    </g>
  </g>

  <!-- Technical Neural Constellation Graph (Synaptic Node Network) -->
  <g opacity="0.38">
    <line x1="80" y1="60" x2="160" y2="110" stroke="#38bdf8" stroke-width="0.8" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.2s" repeatCount="indefinite" />
    </line>
    <line x1="160" y1="110" x2="120" y2="175" stroke="#6366f1" stroke-width="0.8" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.1s" repeatCount="indefinite" />
    </line>
    <line x1="160" y1="110" x2="250" y2="75" stroke="#38bdf8" stroke-width="0.8" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.8s" repeatCount="indefinite" />
    </line>

    <line x1="840" y1="65" x2="760" y2="110" stroke="#38bdf8" stroke-width="0.8" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="760" y1="110" x2="800" y2="175" stroke="#6366f1" stroke-width="0.8" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.5s" repeatCount="indefinite" />
    </line>
    <line x1="760" y1="110" x2="670" y2="75" stroke="#38bdf8" stroke-width="0.8" opacity="0.2">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.9s" repeatCount="indefinite" />
    </line>

    <!-- Floating Synaptic Nodes -->
    <circle cx="80" cy="60" r="2.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="160" cy="110" r="3" fill="#ffffff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="110;106;110" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="175" r="2" fill="#818cf8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="75" r="2.5" fill="#00f0ff">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.9s" repeatCount="indefinite" />
    </circle>

    <circle cx="840" cy="65" r="2.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="110" r="3" fill="#ffffff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="cy" values="110;106;110" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="800" cy="175" r="2" fill="#818cf8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="670" cy="75" r="2.5" fill="#00f0ff">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Architectural Subtle Tech Grid Background -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.8">
    <line x1="115" y1="0" x2="115" y2="230" />
    <line x1="260" y1="0" x2="260" y2="230" />
    <line x1="460" y1="0" x2="460" y2="230" />
    <line x1="660" y1="0" x2="660" y2="230" />
    <line x1="805" y1="0" x2="805" y2="230" />
    <line x1="0" y1="58" x2="920" y2="58" />
    <line x1="0" y1="115" x2="920" y2="115" />
    <line x1="0" y1="172" x2="920" y2="172" />
  </g>

  <!-- Flowing Undulating Cyber Wave Ribbons (Fade into #0d1117 at bottom) -->
  <g>
    <!-- Wave 1: Deep Cyan Fluid -->
    <path fill="url(#waveCyanGrad)" d="M 0,180 Q 230,150 460,175 T 920,170 L 920,230 L 0,230 Z">
      <animate attributeName="d" 
        values="
          M 0,180 Q 230,150 460,175 T 920,170 L 920,230 L 0,230 Z;
          M 0,172 Q 230,200 460,165 T 920,185 L 920,230 L 0,230 Z;
          M 0,180 Q 230,150 460,175 T 920,170 L 920,230 L 0,230 Z
        " 
        dur="7.5s" 
        repeatCount="indefinite" 
      />
    </path>
    <!-- Crest Line on Wave 1 -->
    <path fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.45" d="M 0,180 Q 230,150 460,175 T 920,170">
      <animate attributeName="d" 
        values="
          M 0,180 Q 230,150 460,175 T 920,170;
          M 0,172 Q 230,200 460,165 T 920,185;
          M 0,180 Q 230,150 460,175 T 920,170
        " 
        dur="7.5s" 
        repeatCount="indefinite" 
      />
    </path>

    <!-- Wave 2: Electric Indigo Fluid -->
    <path fill="url(#waveIndigoGrad)" d="M 0,190 Q 260,208 520,178 T 920,192 L 920,230 L 0,230 Z">
      <animate attributeName="d" 
        values="
          M 0,190 Q 260,208 520,178 T 920,192 L 920,230 L 0,230 Z;
          M 0,184 Q 260,165 520,202 T 920,178 L 920,230 L 0,230 Z;
          M 0,190 Q 260,208 520,178 T 920,192 L 920,230 L 0,230 Z
        " 
        dur="9.5s" 
        repeatCount="indefinite" 
      />
    </path>
  </g>

  <!-- ==================== SEAMLESS EDGE BLEND OVERLAYS ==================== -->
  <rect y="160" width="920" height="70" fill="url(#bottomBlend)" />
  <rect y="0" width="920" height="30" fill="url(#topBlend)" />
  <rect x="0" y="0" width="60" height="230" fill="url(#leftBlend)" />
  <rect x="860" y="0" width="60" height="230" fill="url(#rightBlend)" />

  <!-- ==================== MAIN CENTER IDENTITY ==================== -->
  <g transform="translate(460, 68)" text-anchor="middle">
    <!-- Overline with Quantum Tag -->
    <g transform="translate(0, -14)">
      <text fill="#38bdf8" class="mono" font-size="11" font-weight="700" letter-spacing="3.5">
        &lt; AI SYSTEMS ARCHITECT &amp; CO-FOUNDER /&gt;
      </text>
      <line x1="-160" y1="8" x2="160" y2="8" stroke="#38bdf8" stroke-width="0.8" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- MAIN NAME TITLE: 100% Crisp, Pure White, Razor-Sharp (NO GLOW) -->
    <text y="42" fill="#ffffff" class="sans hero-title" font-size="46">
      ABHAY GUPTA
    </text>

    <!-- Laser Beam & Shockwave Particle Ping -->
    <g transform="translate(-230, 56)">
      <!-- Base hairline track -->
      <line x1="0" y1="0" x2="460" y2="0" stroke="#1f2c42" stroke-width="1" />
      
      <!-- Primary Traveling High-Velocity Laser -->
      <line x1="50" y1="0" x2="220" y2="0" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" filter="url(#laserGlow)">
        <animate attributeName="x1" values="-50;340;-50" dur="4s" repeatCount="indefinite" />
        <animate attributeName="x2" values="120;510;120" dur="4s" repeatCount="indefinite" />
      </line>

      <!-- Secondary Trailing White Pulse -->
      <line x1="120" y1="0" x2="200" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x1" values="-10;380;-10" dur="4s" repeatCount="indefinite" />
        <animate attributeName="x2" values="70;460;70" dur="4s" repeatCount="indefinite" />
      </line>

      <!-- Center Pulse Diamond -->
      <circle cx="230" cy="0" r="2.5" fill="#38bdf8">
        <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#38bdf8;#ffffff;#818cf8;#38bdf8" dur="4s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Professional Authority Subtitle -->
    <text y="82" fill="#cbd5e1" class="sans" font-size="15.5" font-weight="600" letter-spacing="0.8">
      Co-Founder @ Quantaforze <tspan fill="#38bdf8">•</tspan> AI/ML Engineer <tspan fill="#818cf8">•</tspan> Full-Stack Systems Architect
    </text>

    <!-- Bottom Feature Chips with Subtle Styling -->
    <g transform="translate(0, 115)">
      <!-- Chip 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-68" y="-12" width="136" height="24" rx="12" fill="#111927" stroke="#1f2c42" stroke-width="1" />
        <circle cx="-52" cy="0" r="2" fill="#38bdf8">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
        </circle>
        <text x="5" y="3.5" fill="#94a3b8" class="mono" font-size="9.5" font-weight="700">AGENTIC AI &amp; NLP</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(-75, 0)">
        <rect x="-68" y="-12" width="136" height="24" rx="12" fill="#111927" stroke="#1f2c42" stroke-width="1" />
        <circle cx="-52" cy="0" r="2" fill="#818cf8">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
        </circle>
        <text x="5" y="3.5" fill="#94a3b8" class="mono" font-size="9.5" font-weight="700">AZURE AI CLOUD</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(80, 0)">
        <rect x="-68" y="-12" width="136" height="24" rx="12" fill="#111927" stroke="#1f2c42" stroke-width="1" />
        <circle cx="-52" cy="0" r="2" fill="#38bdf8">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite" />
        </circle>
        <text x="5" y="3.5" fill="#94a3b8" class="mono" font-size="9.5" font-weight="700">TURBO MONOREPO</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(235, 0)">
        <rect x="-68" y="-12" width="136" height="24" rx="12" fill="#111927" stroke="#1f2c42" stroke-width="1" />
        <circle cx="-52" cy="0" r="2" fill="#818cf8">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite" />
        </circle>
        <text x="5" y="3.5" fill="#94a3b8" class="mono" font-size="9.5" font-weight="700">NEXT.JS &amp; DOCKER</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="230">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="profileBgClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040712" />
      <stop offset="50%" stop-color="#070c1a" />
      <stop offset="100%" stop-color="#0a1024" />
    </linearGradient>

    <!-- Traveling Perimeter Laser -->
    <linearGradient id="profileBorderLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cleanBarCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cleanBarIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="profileGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 1s step-end infinite; }
  </style>

  <!-- Container Box -->
  <rect width="920" height="230" rx="14" fill="url(#profileBgClean)" stroke="#162035" stroke-width="1.2" />

  <!-- Animated Traveling Perimeter Laser -->
  <rect width="920" height="230" rx="14" fill="none" stroke="url(#profileBorderLaser)" stroke-width="1.5" stroke-dasharray="110 2300" filter="url(#profileGlow)">
    <animate attributeName="stroke-dashoffset" values="0; -2410" dur="7.2s" repeatCount="indefinite" />
  </rect>

  <!-- Window Header -->
  <path d="M 0,14 Q 0,0 14,0 L 906,0 Q 920,0 920,14 L 920,36 L 0,36 Z" fill="#0c1426" />
  <line x1="0" y1="36" x2="920" y2="36" stroke="#172235" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="18" r="4.5" fill="#ef4444" opacity="0.9" />
  <circle cx="39" cy="18" r="4.5" fill="#f59e0b" opacity="0.9" />
  <circle cx="54" cy="18" r="4.5" fill="#10b981" opacity="0.9" />
  
  <text x="460" y="22" fill="#64748b" class="mono" font-size="11" font-weight="600" text-anchor="middle">
    quantaforze_founder.py — CodeOrbit26
  </text>

  <!-- Content Split Grid -->
  
  <!-- LEFT COLUMN: Founder Configuration in Python -->
  <g transform="translate(28, 62)">
    <text x="0" y="0" fill="#38bdf8" class="mono" font-size="12" font-weight="600">founder</text>
    <text x="65" y="0" fill="#cbd5e1" class="mono" font-size="12">=</text>
    <text x="80" y="0" fill="#f8fafc" class="mono" font-size="12">{</text>

    <g transform="translate(18, 20)">
      <text x="0" y="0" fill="#38bdf8" class="mono" font-size="11">"role"</text>
      <text x="45" y="0" fill="#64748b" class="mono" font-size="11">:</text>
      <text x="60" y="0" fill="#ffffff" class="mono" font-size="11" font-weight="600">"Co-Founder @ Quantaforze"</text>
      <text x="265" y="0" fill="#475569" class="mono" font-size="11">,</text>

      <text x="0" y="20" fill="#38bdf8" class="mono" font-size="11">"discipline"</text>
      <text x="85" y="20" fill="#64748b" class="mono" font-size="11">:</text>
      <text x="100" y="20" fill="#38bdf8" class="mono" font-size="11">"AI Systems &amp; Full-Stack"</text>
      <text x="295" y="20" fill="#475569" class="mono" font-size="11">,</text>

      <text x="0" y="40" fill="#38bdf8" class="mono" font-size="11">"focus"</text>
      <text x="50" y="40" fill="#64748b" class="mono" font-size="11">:</text>
      <text x="65" y="40" fill="#cbd5e1" class="mono" font-size="11">["Agentic AI", "NLP", "Azure AI"]</text>
      <text x="320" y="40" fill="#475569" class="mono" font-size="11">,</text>

      <text x="0" y="60" fill="#38bdf8" class="mono" font-size="11">"stack"</text>
      <text x="50" y="60" fill="#64748b" class="mono" font-size="11">:</text>
      <text x="65" y="60" fill="#818cf8" class="mono" font-size="11">["Python", "TypeScript", "Docker"]</text>
      <text x="330" y="60" fill="#475569" class="mono" font-size="11">,</text>

      <text x="0" y="80" fill="#38bdf8" class="mono" font-size="11">"open_to"</text>
      <text x="60" y="80" fill="#64748b" class="mono" font-size="11">:</text>
      <text x="75" y="80" fill="#10b981" class="mono" font-size="11" font-weight="bold">"Engineering &amp; Collaborations"</text>
    </g>

    <text x="0" y="122" fill="#f8fafc" class="mono" font-size="12">}</text>
    <rect x="15" y="112" width="7" height="13" fill="#38bdf8" class="cursor" />
  </g>

  <!-- Vertical Hairline Divider -->
  <line x1="500" y1="46" x2="500" y2="215" stroke="#172235" stroke-width="1" stroke-dasharray="3,3" />

  <!-- RIGHT COLUMN: Engineering Competency Index -->
  <g transform="translate(525, 62)">
    <text x="0" y="0" fill="#38bdf8" class="mono" font-size="11" font-weight="700" letter-spacing="1.2">
      // CORE ENGINEERING COMPETENCY
    </text>

    <!-- Bar 1: Agentic AI & NLP -->
    <g transform="translate(0, 24)">
      <text x="0" y="0" fill="#e2e8f0" class="mono" font-size="11">Agentic AI &amp; NLP Workflows</text>
      <text x="350" y="0" fill="#38bdf8" class="mono" font-size="11" text-anchor="end">95%</text>
      <rect x="0" y="6" width="350" height="4.5" rx="2.2" fill="#131d2e" />
      <rect x="0" y="6" width="332" height="4.5" rx="2.2" fill="url(#cleanBarCyan)">
        <animate attributeName="width" values="120;332;318;332" dur="4s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Bar 2: Full-Stack Systems -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" fill="#e2e8f0" class="mono" font-size="11">Full-Stack (Next.js / TypeScript / Monorepo)</text>
      <text x="350" y="0" fill="#818cf8" class="mono" font-size="11" text-anchor="end">92%</text>
      <rect x="0" y="6" width="350" height="4.5" rx="2.2" fill="#131d2e" />
      <rect x="0" y="6" width="322" height="4.5" rx="2.2" fill="url(#cleanBarIndigo)">
        <animate attributeName="width" values="100;322;305;322" dur="4.5s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Bar 3: Cloud & Container Systems -->
    <g transform="translate(0, 80)">
      <text x="0" y="0" fill="#e2e8f0" class="mono" font-size="11">Azure AI, Cloud &amp; Container Infrastructure</text>
      <text x="350" y="0" fill="#38bdf8" class="mono" font-size="11" text-anchor="end">88%</text>
      <rect x="0" y="6" width="350" height="4.5" rx="2.2" fill="#131d2e" />
      <rect x="0" y="6" width="308" height="4.5" rx="2.2" fill="url(#cleanBarCyan)">
        <animate attributeName="width" values="90;308;294;308" dur="5s" repeatCount="indefinite" />
      </rect>
    </g>

    <text x="0" y="122" fill="#475569" class="mono" font-size="9.5">
      // HIGH-THROUGHPUT ARCHITECTURE &amp; PRODUCTION RESILIENCE
    </text>
  </g>
</svg>

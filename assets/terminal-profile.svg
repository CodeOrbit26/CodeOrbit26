<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <style>
    text {
      font-family: 'Courier New', 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Mono', monospace;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
  
  <rect width="800" height="200" rx="8" fill="#0d1117" stroke="#1b2028" stroke-width="1"/>
  
  <!-- Terminal header -->
  <circle cx="20" cy="15" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="15" r="5" fill="#febc2e"/>
  <circle cx="52" cy="15" r="5" fill="#28c840"/>
  <text x="370" y="18" fill="#484f58" font-size="11" text-anchor="middle">profile — zsh</text>
  
  <!-- Command prompt -->
  <text x="20" y="50" fill="#c9a84c" font-size="12">abhay@github</text>
  <text x="118" y="50" fill="#484f58" font-size="12">:</text>
  <text x="125" y="50" fill="#7c6aef" font-size="12">~</text>
  <text x="135" y="50" fill="#484f58" font-size="12">$</text>
  <text x="148" y="50" fill="#c9d1d9" font-size="12">whoami --verbose</text>
  
  <!-- Output -->
  <text x="20" y="78" fill="#484f58" font-size="12">┌──────────────────────────────────────────────────────┐</text>
  <text x="20" y="96" fill="#484f58" font-size="12">│</text>
  <text x="40" y="96" fill="#6e7681" font-size="12">Name</text>
  <text x="140" y="96" fill="#c9d1d9" font-size="12">Abhay Gupta</text>
  
  <text x="20" y="114" fill="#484f58" font-size="12">│</text>
  <text x="40" y="114" fill="#6e7681" font-size="12">Role</text>
  <text x="140" y="114" fill="#c9d1d9" font-size="12">AI/ML Student</text>
  
  <text x="20" y="132" fill="#484f58" font-size="12">│</text>
  <text x="40" y="132" fill="#6e7681" font-size="12">Focus</text>
  <text x="140" y="132" fill="#c9a84c" font-size="12">AI · NLP · Deep Learning · Agentic AI</text>
  
  <text x="20" y="150" fill="#484f58" font-size="12">│</text>
  <text x="40" y="150" fill="#6e7681" font-size="12">Building</text>
  <text x="140" y="150" fill="#7c6aef" font-size="12">Intelligent systems &amp; digital products</text>
  
  <text x="20" y="168" fill="#484f58" font-size="12">│</text>
  <text x="40" y="168" fill="#6e7681" font-size="12">GitHub</text>
  <text x="140" y="168" fill="#58a6ff" font-size="12">github.com/CodeOrbit26</text>
  
  <text x="20" y="186" fill="#484f58" font-size="12">└──────────────────────────────────────────────────────┘</text>
  
  <!-- Blinking cursor -->
  <rect x="20" y="193" width="7" height="2" fill="#c9a84c" class="cursor"/>
</svg>

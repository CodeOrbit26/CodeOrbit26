<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230">
  <defs>
    <linearGradient id="profileBgClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050812" />
      <stop offset="100%" stop-color="#0b1122" />
    </linearGradient>

    <linearGradient id="cleanBarCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cleanBarIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 1s step-end infinite; }
  </style>

  <!-- Container with subtle slate border -->
  <rect width="900" height="230" rx="12" fill="url(#profileBgClean)" stroke="#1a2438" stroke-width="1.2" />

  <!-- Window Header -->
  <rect width="900" height="34" rx="12" fill="#0d1424" />
  <rect y="22" width="900" height="12" fill="#0d1424" />
  <line x1="0" y1="34" x2="900" y2="34" stroke="#172235" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="22" cy="17" r="4.5" fill="#ef4444" opacity="0.85" />
  <circle cx="36" cy="17" r="4.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="50" cy="17" r="4.5" fill="#10b981" opacity="0.85" />
  
  <text x="450" y="21" fill="#64748b" class="mono" font-size="11" text-anchor="middle">
    quantaforze.founder.ts — CodeOrbit26
  </text>

  <!-- Content Split Grid -->
  
  <!-- LEFT COLUMN: Founder Configuration -->
  <g transform="translate(26, 60)">
    <text x="0" y="0" fill="#f43f5e" class="mono" font-size="12" font-weight="600">export const</text>
    <text x="95" y="0" fill="#38bdf8" class="mono" font-size="12" font-weight="600">founder</text>
    <text x="160" y="0" fill="#cbd5e1" class="mono" font-size="12">=</text>
    <text x="175" y="0" fill="#f8fafc" class="mono" font-size="12">{</text>

    <g transform="translate(18, 20)">
      <text x="0" y="0" fill="#64748b" class="mono" font-size="11">role:</text>
      <text x="65" y="0" fill="#ffffff" class="mono" font-size="11" font-weight="600">"Co-Founder @ Quantaforze"</text>
      <text x="270" y="0" fill="#475569" class="mono" font-size="11">,</text>

      <text x="0" y="20" fill="#64748b" class="mono" font-size="11">discipline:</text>
      <text x="95" y="20" fill="#38bdf8" class="mono" font-size="11">"AI Systems &amp; Full-Stack"</text>
      <text x="290" y="20" fill="#475569" class="mono" font-size="11">,</text>

      <text x="0" y="40" fill="#64748b" class="mono" font-size="11">focus:</text>
      <text x="55" y="40" fill="#cbd5e1" class="mono" font-size="11">["Agentic AI", "NLP", "Azure AI"]</text>
      <text x="310" y="40" fill="#475569" class="mono" font-size="11">,</text>

      <text x="0" y="60" fill="#64748b" class="mono" font-size="11">stack:</text>
      <text x="55" y="60" fill="#818cf8" class="mono" font-size="11">["TypeScript", "Next.js", "Docker"]</text>
      <text x="325" y="60" fill="#475569" class="mono" font-size="11">,</text>

      <text x="0" y="80" fill="#64748b" class="mono" font-size="11">openTo:</text>
      <text x="65" y="80" fill="#10b981" class="mono" font-size="11" font-weight="bold">"Engineering &amp; Collaborations"</text>
    </g>

    <text x="0" y="122" fill="#f8fafc" class="mono" font-size="12">};</text>
    <rect x="20" y="112" width="7" height="13" fill="#38bdf8" class="cursor" />
  </g>

  <!-- Vertical Hairline Divider -->
  <line x1="490" y1="46" x2="490" y2="215" stroke="#172235" stroke-width="1" stroke-dasharray="3,3" />

  <!-- RIGHT COLUMN: Engineering Competency Index -->
  <g transform="translate(515, 60)">
    <text x="0" y="0" fill="#38bdf8" class="mono" font-size="11" font-weight="700" letter-spacing="1">
      // CORE ENGINEERING COMPETENCY
    </text>

    <!-- Bar 1: Agentic & Intelligent Systems -->
    <g transform="translate(0, 24)">
      <text x="0" y="0" fill="#e2e8f0" class="mono" font-size="11">Agentic AI &amp; NLP Workflows</text>
      <text x="340" y="0" fill="#38bdf8" class="mono" font-size="11" text-anchor="end">95%</text>
      <rect x="0" y="6" width="340" height="4" rx="2" fill="#131d2e" />
      <rect x="0" y="6" width="323" height="4" rx="2" fill="url(#cleanBarCyan)">
        <animate attributeName="width" values="120;323;310;323" dur="4s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Bar 2: Full-Stack Systems -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" fill="#e2e8f0" class="mono" font-size="11">Full-Stack (Next.js / TypeScript / Monorepo)</text>
      <text x="340" y="0" fill="#818cf8" class="mono" font-size="11" text-anchor="end">92%</text>
      <rect x="0" y="6" width="340" height="4" rx="2" fill="#131d2e" />
      <rect x="0" y="6" width="312" height="4" rx="2" fill="url(#cleanBarIndigo)">
        <animate attributeName="width" values="100;312;295;312" dur="4.5s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Bar 3: Cloud & Container Systems -->
    <g transform="translate(0, 80)">
      <text x="0" y="0" fill="#e2e8f0" class="mono" font-size="11">Azure AI, Cloud &amp; Container Infrastructure</text>
      <text x="340" y="0" fill="#38bdf8" class="mono" font-size="11" text-anchor="end">88%</text>
      <rect x="0" y="6" width="340" height="4" rx="2" fill="#131d2e" />
      <rect x="0" y="6" width="299" height="4" rx="2" fill="url(#cleanBarCyan)">
        <animate attributeName="width" values="90;299;285;299" dur="5s" repeatCount="indefinite" />
      </rect>
    </g>

    <text x="0" y="122" fill="#475569" class="mono" font-size="9.5">
      // HIGH-THROUGHPUT ARCHITECTURE &amp; PRODUCTION RESILIENCE
    </text>
  </g>
</svg>

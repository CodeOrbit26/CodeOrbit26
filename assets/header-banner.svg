<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="45%" stop-color="#0b0f19" />
      <stop offset="85%" stop-color="#120e24" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>

    <!-- Animated Shimmer Gradient for Name -->
    <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c">
        <animate attributeName="stop-color" values="#c9a84c; #ffffff; #7c6aef; #c9a84c" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff; #7c6aef; #c9a84c; #ffffff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7c6aef">
        <animate attributeName="stop-color" values="#7c6aef; #c9a84c; #ffffff; #7c6aef" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff; #c9a84c; #ffffff; #58a6ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c9a84c">
        <animate attributeName="stop-color" values="#c9a84c; #ffffff; #7c6aef; #c9a84c" dur="6s" repeatCount="indefinite" />
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" from="-100,0" to="100,0" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Pulsing Glow Filters -->
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowViolet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c6aef" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#7c6aef" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="ambientViolet" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7c6aef" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.2;0.45;0.2" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7c6aef" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientGold" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientCyan" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.1;0.25;0.1" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0" />
    </radialGradient>

    <!-- Badge Background -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b26" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1b1f2e" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-12px) translateX(6px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes sweepLine {
      0% { x1: 0; x2: 120; opacity: 0.2; }
      50% { x1: 390; x2: 510; opacity: 1; }
      100% { x1: 780; x2: 900; opacity: 0.2; }
    }
    .mono {
      font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Courier New', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }
    .shimmer-text {
      letter-spacing: 3.5px;
      font-weight: 800;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
  </style>

  <!-- Container Box with Rounded Borders -->
  <rect width="900" height="240" rx="16" fill="url(#bgGradient)" stroke="#1e2538" stroke-width="1.5" />

  <!-- Ambient Pulsing Glow Clouds -->
  <rect width="900" height="240" rx="16" fill="url(#ambientViolet)" />
  <rect width="900" height="240" rx="16" fill="url(#ambientGold)" />
  <rect width="900" height="240" rx="16" fill="url(#ambientCyan)" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.75">
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="250" y1="0" x2="250" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="550" y1="0" x2="550" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="850" y1="0" x2="850" y2="240" />
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="180" x2="900" y2="180" />
  </g>

  <!-- Animated Glowing Sine Waves at Bottom -->
  <g opacity="0.85">
    <!-- Wave 1 -->
    <path fill="url(#waveGrad1)" d="M 0,195 Q 150,165 300,190 T 600,185 T 900,195 L 900,240 L 0,240 Z">
      <animate attributeName="d" 
        values="
          M 0,195 Q 150,165 300,190 T 600,185 T 900,195 L 900,240 L 0,240 Z;
          M 0,190 Q 150,210 300,180 T 600,205 T 900,185 L 900,240 L 0,240 Z;
          M 0,195 Q 150,165 300,190 T 600,185 T 900,195 L 900,240 L 0,240 Z
        " 
        dur="7s" 
        repeatCount="indefinite" 
      />
    </path>
    <!-- Wave 2 -->
    <path fill="url(#waveGrad2)" d="M 0,205 Q 200,225 450,195 T 900,205 L 900,240 L 0,240 Z">
      <animate attributeName="d" 
        values="
          M 0,205 Q 200,225 450,195 T 900,205 L 900,240 L 0,240 Z;
          M 0,200 Q 200,175 450,215 T 900,195 L 900,240 L 0,240 Z;
          M 0,205 Q 200,225 450,195 T 900,205 L 900,240 L 0,240 Z
        " 
        dur="9s" 
        repeatCount="indefinite" 
      />
    </path>
  </g>

  <!-- Constellation Nodes & Animated Floating Dust Particles -->
  <g fill="#c9a84c">
    <circle cx="95" cy="55" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="55;50;55" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="90" r="1.5" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="60" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="60;53;60" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="830" cy="110" r="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite" />
    </circle>
  </g>
  <g fill="#7c6aef">
    <circle cx="210" cy="40" r="2.2" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="710" cy="160" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="160;152;160" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>
  <g fill="#38bdf8">
    <circle cx="280" cy="170" r="1.8" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="45" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Window Header Bar / Top Controls -->
  <g transform="translate(24, 22)">
    <!-- Terminal window dots -->
    <circle cx="0" cy="0" r="5" fill="#ff5f56" />
    <circle cx="16" cy="0" r="5" fill="#ffbd2e" />
    <circle cx="32" cy="0" r="5" fill="#27c93f" />

    <!-- Terminal Identifier -->
    <text x="50" y="3.5" fill="#58657a" class="mono" font-size="11" font-weight="500">codeorbit26 // core-space</text>
  </g>

  <!-- Live Status Beacon Pill (Top Right) -->
  <g transform="translate(640, 14)">
    <rect width="236" height="24" rx="12" fill="url(#badgeGrad)" stroke="#243048" stroke-width="1" />
    <!-- Pulsing Radar Halo -->
    <circle cx="18" cy="12" r="4" fill="none" stroke="#10b981" stroke-width="1.5">
      <animate attributeName="r" values="4;10;13" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.3;0" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <!-- Solid Center Dot -->
    <circle cx="18" cy="12" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="16" fill="#a5f3fc" class="mono" font-size="10" font-weight="600" letter-spacing="0.5">OPEN TO COLLABORATE</text>
  </g>

  <!-- Main Hero Content (Centered) -->
  <g transform="translate(450, 85)" text-anchor="middle">
    <!-- Monospace Micro Tag -->
    <text y="-14" fill="#c9a84c" class="mono" font-size="12" font-weight="600" letter-spacing="2.5">
      &lt;SYSTEM ARCHITECT &amp; AI BUILDER /&gt;
    </text>

    <!-- Main Name Title with Vibrant Animated Shimmer Gradient -->
    <text y="38" fill="url(#shimmerGradient)" class="sans shimmer-text" font-size="44" filter="url(#glowGold)">
      ABHAY GUPTA
    </text>

    <!-- Dynamic Laser Accent Beam Under Name -->
    <g transform="translate(-250, 48)">
      <line x1="0" y1="0" x2="500" y2="0" stroke="#1b253b" stroke-width="1" />
      <!-- Traveling laser pulse -->
      <line x1="150" y1="0" x2="350" y2="0" stroke="url(#waveGrad1)" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x1" values="50;250;50" dur="4s" repeatCount="indefinite" />
        <animate attributeName="x2" values="200;450;200" dur="4s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Professional Subtitle -->
    <text y="74" fill="#e2e8f0" class="sans" font-size="16" font-weight="500" letter-spacing="1.2">
      AI/ML Student <tspan fill="#7c6aef" font-weight="bold">|</tspan> Agentic AI &amp; NLP <tspan fill="#c9a84c" font-weight="bold">|</tspan> Full-Stack Engineer
    </text>

    <!-- Quick Domain Tech Badges -->
    <g transform="translate(0, 108)">
      <!-- Badge 1 -->
      <g transform="translate(-220, 0)">
        <rect x="-65" y="-12" width="130" height="22" rx="11" fill="#131926" stroke="#2a3652" stroke-width="1" />
        <text y="3" fill="#a5b4fc" class="mono" font-size="10.5" font-weight="600">⚡ AGENTIC AI</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(-70, 0)">
        <rect x="-65" y="-12" width="130" height="22" rx="11" fill="#131926" stroke="#2a3652" stroke-width="1" />
        <text y="3" fill="#38bdf8" class="mono" font-size="10.5" font-weight="600">🧠 NLP &amp; LLMS</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(75, 0)">
        <rect x="-65" y="-12" width="130" height="22" rx="11" fill="#131926" stroke="#2a3652" stroke-width="1" />
        <text y="3" fill="#fde047" class="mono" font-size="10.5" font-weight="600">☁️ AZURE AI</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(225, 0)">
        <rect x="-70" y="-12" width="140" height="22" rx="11" fill="#131926" stroke="#2a3652" stroke-width="1" />
        <text y="3" fill="#c084fc" class="mono" font-size="10.5" font-weight="600">🚀 FULL-STACK</text>
      </g>
    </g>
  </g>
</svg>

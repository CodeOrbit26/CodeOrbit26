<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Deep obsidian dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="50%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Subtle ice-blue / electric indigo ambient aura -->
    <radialGradient id="auraLeft" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12">
        <animate attributeName="stop-opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auraRight" cx="85%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14">
        <animate attributeName="stop-opacity" values="0.10;0.22;0.10" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- High-end pure white to cool silver shimmer for name -->
    <linearGradient id="titleShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#e0f2fe;#818cf8;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-150,0" to="150,0" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Sleek waves -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.06" />
    </linearGradient>

    <!-- Crisp glow filter -->
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
    }
    .mono {
      font-family: "SF Mono", "Fira Code", "Monaco", "Courier New", monospace;
    }
    .name-title {
      font-weight: 800;
      letter-spacing: 4px;
    }
  </style>

  <!-- Container Box -->
  <rect width="900" height="220" rx="14" fill="url(#bgGrad)" stroke="#172033" stroke-width="1.2" />

  <!-- Ambient Ambient Glows -->
  <rect width="900" height="220" rx="14" fill="url(#auraLeft)" />
  <rect width="900" height="220" rx="14" fill="url(#auraRight)" />

  <!-- Technical Architectural Grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="220" />
    <line x1="220" y1="0" x2="220" y2="220" />
    <line x1="450" y1="0" x2="450" y2="220" />
    <line x1="680" y1="0" x2="680" y2="220" />
    <line x1="820" y1="0" x2="820" y2="220" />
    <line x1="0" y1="55" x2="900" y2="55" />
    <line x1="0" y1="110" x2="900" y2="110" />
    <line x1="0" y1="165" x2="900" y2="165" />
  </g>

  <!-- Smooth Undulating Waves at Bottom -->
  <g>
    <!-- Wave Layer 1 -->
    <path fill="url(#wave1)" d="M 0,180 Q 220,150 450,175 T 900,170 L 900,220 L 0,220 Z">
      <animate attributeName="d" 
        values="
          M 0,180 Q 220,150 450,175 T 900,170 L 900,220 L 0,220 Z;
          M 0,172 Q 220,195 450,165 T 900,185 L 900,220 L 0,220 Z;
          M 0,180 Q 220,150 450,175 T 900,170 L 900,220 L 0,220 Z
        " 
        dur="8s" 
        repeatCount="indefinite" 
      />
    </path>
    <!-- Wave Layer 2 -->
    <path fill="url(#wave2)" d="M 0,190 Q 250,205 500,180 T 900,195 L 900,220 L 0,220 Z">
      <animate attributeName="d" 
        values="
          M 0,190 Q 250,205 500,180 T 900,195 L 900,220 L 0,220 Z;
          M 0,185 Q 250,165 500,195 T 900,180 L 900,220 L 0,220 Z;
          M 0,190 Q 250,205 500,180 T 900,195 L 900,220 L 0,220 Z
        " 
        dur="10s" 
        repeatCount="indefinite" 
      />
    </path>
  </g>

  <!-- Constellation Nodes / Subtle Particles -->
  <g fill="#38bdf8">
    <circle cx="120" cy="50" r="1.5" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="50;45;50" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="55" r="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="55;48;55" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>
  <g fill="#818cf8">
    <circle cx="240" cy="150" r="1.8" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="680" cy="140" r="1.8" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Top Bar: Left Window Controls, Right Founder Status -->
  <g transform="translate(24, 20)">
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="14" cy="0" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="28" cy="0" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="44" y="3.5" fill="#475569" class="mono" font-size="10.5" font-weight="500">codeorbit // quantaforze</text>
  </g>

  <!-- Right Pill: Clean Founder Status -->
  <g transform="translate(680, 13)">
    <rect width="196" height="22" rx="11" fill="#0c1322" stroke="#1e293b" stroke-width="1" />
    <!-- Pulse ring -->
    <circle cx="16" cy="11" r="3.5" fill="none" stroke="#10b981" stroke-width="1.2">
      <animate attributeName="r" values="3.5;8;10" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="16" cy="11" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="14.5" fill="#cbd5e1" class="mono" font-size="9.5" font-weight="600" letter-spacing="0.5">CO-FOUNDER @ QUANTAFORZE</text>
  </g>

  <!-- Center Content: Name and Professional Identity -->
  <g transform="translate(450, 78)" text-anchor="middle">
    <!-- Clean Founder Overline -->
    <text y="-8" fill="#38bdf8" class="mono" font-size="11" font-weight="600" letter-spacing="2.5">
      FOUNDER &amp; AI SYSTEMS ARCHITECT
    </text>

    <!-- Main Name Title in Crisp Shimmering White -->
    <text y="42" fill="url(#titleShimmer)" class="sans name-title" font-size="46" filter="url(#cleanGlow)">
      ABHAY GUPTA
    </text>

    <!-- Subtle Slate Laser Divider -->
    <g transform="translate(-200, 53)">
      <line x1="0" y1="0" x2="400" y2="0" stroke="#1e293b" stroke-width="1" />
      <!-- Traveling subtle light beam -->
      <line x1="80" y1="0" x2="220" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
        <animate attributeName="x1" values="20;200;20" dur="5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="140;380;140" dur="5s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Sleek, High-Status Subtitle -->
    <text y="78" fill="#cbd5e1" class="sans" font-size="15.5" font-weight="500" letter-spacing="0.8">
      Co-Founder @ Quantaforze <tspan fill="#64748b">•</tspan> AI/ML Engineer <tspan fill="#64748b">•</tspan> Full-Stack Systems
    </text>

    <!-- Cohesive, High-Tech Minimalist Chips -->
    <g transform="translate(0, 108)">
      <g transform="translate(-210, 0)">
        <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#0d1424" stroke="#1e293b" stroke-width="1" />
        <text y="3" fill="#94a3b8" class="mono" font-size="10" font-weight="600">AGENTIC AI &amp; NLP</text>
      </g>
      <g transform="translate(-65, 0)">
        <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#0d1424" stroke="#1e293b" stroke-width="1" />
        <text y="3" fill="#94a3b8" class="mono" font-size="10" font-weight="600">AZURE AI CLOUD</text>
      </g>
      <g transform="translate(80, 0)">
        <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#0d1424" stroke="#1e293b" stroke-width="1" />
        <text y="3" fill="#94a3b8" class="mono" font-size="10" font-weight="600">TURBOREPO MONO</text>
      </g>
      <g transform="translate(225, 0)">
        <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#0d1424" stroke="#1e293b" stroke-width="1" />
        <text y="3" fill="#94a3b8" class="mono" font-size="10" font-weight="600">NEXT.JS &amp; DOCKER</text>
      </g>
    </g>
  </g>
</svg>

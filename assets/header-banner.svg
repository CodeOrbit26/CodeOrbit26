<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="250">
  <defs>
    <!-- Deep Obsidian Space Canvas Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030610" />
      <stop offset="35%" stop-color="#060a18" />
      <stop offset="70%" stop-color="#090e24" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>

    <!-- Traveling Perimeter Laser Gradient -->
    <linearGradient id="borderLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#0ea5e9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Liquid Metallic Name Shimmer Gradient -->
    <linearGradient id="liquidShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff; #38bdf8; #a5b4fc; #ffffff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-200,0" to="200,0" dur="4.5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Quantum Aurora Gradients -->
    <radialGradient id="auroraCyan" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.14;0.28;0.14" dur="5s" repeatCount="indefinite" />
        <animate attributeName="cx" values="20%;25%;20%" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraIndigo" cx="80%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.24">
        <animate attributeName="stop-opacity" values="0.15;0.32;0.15" dur="6s" repeatCount="indefinite" />
        <animate attributeName="cx" values="80%;74%;80%" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerCoreGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25">
        <animate attributeName="r" values="35%;50%;35%" dur="4s" repeatCount="indefinite" />
        <animate attributeName="stop-opacity" values="0.18;0.32;0.18" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#060913" stop-opacity="0" />
    </radialGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="waveIndigoGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.12" />
    </linearGradient>

    <!-- High-Definition Glow Filter -->
    <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Glass Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1629" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#131c33" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
    }
    .mono {
      font-family: "SF Mono", "Fira Code", "Monaco", "Courier New", monospace;
    }
    .hero-title {
      font-weight: 900;
      letter-spacing: 5.5px;
    }
    @keyframes orbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbitSpinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .orbital-1 {
      transform-origin: 460px 125px;
      animation: orbitSpin 35s linear infinite;
    }
    .orbital-2 {
      transform-origin: 460px 125px;
      animation: orbitSpinReverse 48s linear infinite;
    }
  </style>

  <!-- Base Obsidian Shell -->
  <rect width="920" height="250" rx="16" fill="url(#canvasBg)" />

  <!-- Dynamic Ambient Glowing Aurora Clouds -->
  <rect width="920" height="250" rx="16" fill="url(#auroraCyan)" />
  <rect width="920" height="250" rx="16" fill="url(#auroraIndigo)" />
  <circle cx="460" cy="125" r="220" fill="url(#centerCoreGlow)" />

  <!-- Animated Quantum Orbital Constellation Gyroscope (Background Core) -->
  <g opacity="0.18">
    <ellipse cx="460" cy="125" rx="280" ry="75" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6,8" class="orbital-1" />
    <ellipse cx="460" cy="125" rx="310" ry="85" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,6" class="orbital-2" />
    
    <!-- Rotating satellite photon beads -->
    <g class="orbital-1">
      <circle cx="180" cy="125" r="3" fill="#00f0ff" filter="url(#ultraGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="740" cy="125" r="2.5" fill="#ffffff" filter="url(#ultraGlow)" />
    </g>
    <g class="orbital-2">
      <circle cx="460" cy="40" r="3" fill="#818cf8" filter="url(#ultraGlow)" />
      <circle cx="460" cy="210" r="2" fill="#38bdf8" />
    </g>
  </g>

  <!-- Technical Neural Constellation Graph (Synaptic Node Network) -->
  <g opacity="0.45">
    <!-- Synaptic Connection Lines with Animated Firing -->
    <line x1="80" y1="70" x2="160" y2="120" stroke="#38bdf8" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.2s" repeatCount="indefinite" />
    </line>
    <line x1="160" y1="120" x2="120" y2="190" stroke="#6366f1" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.1s" repeatCount="indefinite" />
    </line>
    <line x1="160" y1="120" x2="250" y2="85" stroke="#38bdf8" stroke-width="1" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.8s" repeatCount="indefinite" />
    </line>
    <line x1="250" y1="85" x2="220" y2="175" stroke="#00f0ff" stroke-width="0.8" opacity="0.2" />

    <!-- Right-Hand Synaptic Cluster -->
    <line x1="840" y1="75" x2="760" y2="120" stroke="#38bdf8" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="760" y1="120" x2="800" y2="185" stroke="#6366f1" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.5s" repeatCount="indefinite" />
    </line>
    <line x1="760" y1="120" x2="670" y2="85" stroke="#38bdf8" stroke-width="1" opacity="0.2">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.9s" repeatCount="indefinite" />
    </line>
    <line x1="670" y1="85" x2="700" y2="180" stroke="#818cf8" stroke-width="0.8" opacity="0.2" />

    <!-- Floating Synaptic Nodes -->
    <!-- Left Cluster -->
    <circle cx="80" cy="70" r="3" fill="#38bdf8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="160" cy="120" r="3.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;116;120" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="190" r="2.5" fill="#818cf8">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="85" r="3" fill="#00f0ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite" />
      <animate attributeName="cy" values="85;81;85" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="220" cy="175" r="2" fill="#38bdf8" />

    <!-- Right Cluster -->
    <circle cx="840" cy="75" r="3" fill="#38bdf8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="3.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="120" r="3.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;115;120" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="800" cy="185" r="2.5" fill="#818cf8">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="670" cy="85" r="3" fill="#00f0ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="85;89;85" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="180" r="2" fill="#38bdf8" />
  </g>

  <!-- Architectural Subtle Tech Grid Background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.8">
    <line x1="115" y1="0" x2="115" y2="250" />
    <line x1="260" y1="0" x2="260" y2="250" />
    <line x1="460" y1="0" x2="460" y2="250" />
    <line x1="660" y1="0" x2="660" y2="250" />
    <line x1="805" y1="0" x2="805" y2="250" />
    <line x1="0" y1="62" x2="920" y2="62" />
    <line x1="0" y1="125" x2="920" y2="125" />
    <line x1="0" y1="188" x2="920" y2="188" />
  </g>

  <!-- Flowing Undulating Cyber Wave Ribbons with Glowing Crests -->
  <g>
    <!-- Wave 1: Deep Cyan Fluid -->
    <path fill="url(#waveCyanGrad)" d="M 0,200 Q 230,170 460,195 T 920,190 L 920,250 L 0,250 Z">
      <animate attributeName="d" 
        values="
          M 0,200 Q 230,170 460,195 T 920,190 L 920,250 L 0,250 Z;
          M 0,192 Q 230,220 460,185 T 920,205 L 920,250 L 0,250 Z;
          M 0,200 Q 230,170 460,195 T 920,190 L 920,250 L 0,250 Z
        " 
        dur="7.5s" 
        repeatCount="indefinite" 
      />
    </path>
    <!-- Glowing Crest Line on Wave 1 -->
    <path fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" d="M 0,200 Q 230,170 460,195 T 920,190" filter="url(#laserGlow)">
      <animate attributeName="d" 
        values="
          M 0,200 Q 230,170 460,195 T 920,190;
          M 0,192 Q 230,220 460,185 T 920,205;
          M 0,200 Q 230,170 460,195 T 920,190
        " 
        dur="7.5s" 
        repeatCount="indefinite" 
      />
    </path>

    <!-- Wave 2: Electric Indigo Fluid -->
    <path fill="url(#waveIndigoGrad)" d="M 0,210 Q 260,228 520,198 T 920,212 L 920,250 L 0,250 Z">
      <animate attributeName="d" 
        values="
          M 0,210 Q 260,228 520,198 T 920,212 L 920,250 L 0,250 Z;
          M 0,204 Q 260,185 520,222 T 920,198 L 920,250 L 0,250 Z;
          M 0,210 Q 260,228 520,198 T 920,212 L 920,250 L 0,250 Z
        " 
        dur="9.5s" 
        repeatCount="indefinite" 
      />
    </path>
    <!-- Glowing Crest Line on Wave 2 -->
    <path fill="none" stroke="#818cf8" stroke-width="1" opacity="0.5" d="M 0,210 Q 260,228 520,198 T 920,212" filter="url(#laserGlow)">
      <animate attributeName="d" 
        values="
          M 0,210 Q 260,228 520,198 T 920,212;
          M 0,204 Q 260,185 520,222 T 920,198;
          M 0,210 Q 260,228 520,198 T 920,212
        " 
        dur="9.5s" 
        repeatCount="indefinite" 
      />
    </path>
  </g>

  <!-- Top Window Header: Left OS Dots, Right Founder Pill -->
  <g transform="translate(26, 22)">
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" opacity="0.9" />
    <circle cx="15" cy="0" r="4.5" fill="#f59e0b" opacity="0.9" />
    <circle cx="30" cy="0" r="4.5" fill="#10b981" opacity="0.9" />
    <text x="48" y="3.5" fill="#64748b" class="mono" font-size="11" font-weight="600" letter-spacing="0.5">
      QUANTAFORZE // DEV_OS v3.0
    </text>
  </g>

  <!-- Status Pill (Top Right): Glassmorphic with Double Pulse Radar -->
  <g transform="translate(685, 13)">
    <rect width="208" height="24" rx="12" fill="url(#pillGrad)" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Outer Sonar Radar Ping 1 -->
    <circle cx="18" cy="12" r="4" fill="none" stroke="#10b981" stroke-width="1.2">
      <animate attributeName="r" values="4;11;14" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.2;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <!-- Outer Sonar Radar Ping 2 (offset) -->
    <circle cx="18" cy="12" r="4" fill="none" stroke="#34d399" stroke-width="1">
      <animate attributeName="r" values="4;9;12" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.15;0" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <!-- Center Green Beacon -->
    <circle cx="18" cy="12" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="1.6s" repeatCount="indefinite" />
    </circle>

    <text x="32" y="16" fill="#f1f5f9" class="mono" font-size="10" font-weight="700" letter-spacing="0.8">
      CO-FOUNDER @ QUANTAFORZE
    </text>
  </g>

  <!-- ==================== MAIN CENTER IDENTITY ==================== -->
  <g transform="translate(460, 88)" text-anchor="middle">
    <!-- Animated Overline with Quantum Tag -->
    <g transform="translate(0, -14)">
      <text fill="#38bdf8" class="mono" font-size="11" font-weight="700" letter-spacing="3.5">
        &lt; AI SYSTEMS ARCHITECT &amp; CO-FOUNDER /&gt;
      </text>
      <line x1="-160" y1="8" x2="160" y2="8" stroke="#38bdf8" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Main Name Title with Liquid Iridescent Shimmer & Deep Backlight -->
    <text y="42" fill="url(#liquidShimmer)" class="sans hero-title" font-size="48" filter="url(#ultraGlow)">
      ABHAY GUPTA
    </text>

    <!-- High-Powered Laser Beam & Shockwave Particle Ping -->
    <g transform="translate(-230, 56)">
      <!-- Base hairline track -->
      <line x1="0" y1="0" x2="460" y2="0" stroke="#172236" stroke-width="1" />
      
      <!-- Primary Traveling High-Velocity Laser -->
      <line x1="50" y1="0" x2="220" y2="0" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" filter="url(#laserGlow)">
        <animate attributeName="x1" values="-50;340;-50" dur="4s" repeatCount="indefinite" />
        <animate attributeName="x2" values="120;510;120" dur="4s" repeatCount="indefinite" />
      </line>

      <!-- Secondary Trailing White Pulse -->
      <line x1="120" y1="0" x2="200" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#ultraGlow)">
        <animate attributeName="x1" values="-10;380;-10" dur="4s" repeatCount="indefinite" />
        <animate attributeName="x2" values="70;460;70" dur="4s" repeatCount="indefinite" />
      </line>

      <!-- Center Pulse Diamond -->
      <circle cx="230" cy="0" r="3" fill="#38bdf8">
        <animate attributeName="r" values="2;4.5;2" dur="2s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#38bdf8;#ffffff;#818cf8;#38bdf8" dur="4s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Professional Authority Subtitle -->
    <text y="82" fill="#e2e8f0" class="sans" font-size="16" font-weight="600" letter-spacing="0.8">
      Co-Founder @ Quantaforze <tspan fill="#38bdf8">•</tspan> AI/ML Engineer <tspan fill="#818cf8">•</tspan> Full-Stack Systems Architect
    </text>

    <!-- Bottom Feature Chips with Glowing Accents -->
    <g transform="translate(0, 115)">
      <!-- Chip 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-68" y="-12" width="136" height="24" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.2" />
        <circle cx="-52" cy="0" r="2.5" fill="#38bdf8">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
        </circle>
        <text x="5" y="3.5" fill="#cbd5e1" class="mono" font-size="9.5" font-weight="700">AGENTIC AI &amp; NLP</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(-75, 0)">
        <rect x="-68" y="-12" width="136" height="24" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.2" />
        <circle cx="-52" cy="0" r="2.5" fill="#818cf8">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
        </circle>
        <text x="5" y="3.5" fill="#cbd5e1" class="mono" font-size="9.5" font-weight="700">AZURE AI CLOUD</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(80, 0)">
        <rect x="-68" y="-12" width="136" height="24" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.2" />
        <circle cx="-52" cy="0" r="2.5" fill="#38bdf8">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite" />
        </circle>
        <text x="5" y="3.5" fill="#cbd5e1" class="mono" font-size="9.5" font-weight="700">TURBO MONOREPO</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(235, 0)">
        <rect x="-68" y="-12" width="136" height="24" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.2" />
        <circle cx="-52" cy="0" r="2.5" fill="#818cf8">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite" />
        </circle>
        <text x="5" y="3.5" fill="#cbd5e1" class="mono" font-size="9.5" font-weight="700">NEXT.JS &amp; DOCKER</text>
      </g>
    </g>
  </g>

  <!-- ==================== ANIMATED PERIMETER LASER BEAM ==================== -->
  <!-- Traveling laser beam running along the entire border of the banner -->
  <rect width="920" height="250" rx="16" fill="none" stroke="url(#borderLaser)" stroke-width="1.8" stroke-dasharray="140 2200" filter="url(#laserGlow)">
    <animate attributeName="stroke-dashoffset" values="0; -2340" dur="6.5s" repeatCount="indefinite" />
  </rect>
  <!-- Base subtle border -->
  <rect width="920" height="250" rx="16" fill="none" stroke="#172238" stroke-width="1" opacity="0.7" />
</svg>

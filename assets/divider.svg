<svg width="800" height="2" viewBox="0 0 800 2" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divider-gradient" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="15%" stop-color="#c9a84c" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15">
        <animate attributeName="stop-opacity" values="0.1;0.2;0.1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="85%" stop-color="#7c6aef" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.15;0.4;0.15" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1" fill="url(#divider-gradient)" rx="0.5"/>
</svg>

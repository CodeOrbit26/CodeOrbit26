<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 76" width="100%" height="76">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Subtle traveling shine for quote -->
    <linearGradient id="quoteTextShine" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-200,0" to="200,0" dur="7s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: "SF Mono", "Fira Code", "Monaco", monospace; }
  </style>

  <!-- Container Box with clean slate border -->
  <rect width="900" height="76" rx="10" fill="url(#quoteBg)" stroke="#1e293b" stroke-width="1" />

  <!-- Left Accent Bar with Subtle Cyan Pulse -->
  <rect x="0" y="8" width="3" height="60" rx="1.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
  </rect>

  <g transform="translate(450, 30)" text-anchor="middle">
    <text y="-8" fill="#38bdf8" class="mono" font-size="10" font-weight="700" letter-spacing="2">
      // ARCHITECTURAL VISION
    </text>
    <text y="20" fill="url(#quoteTextShine)" class="sans" font-size="14" font-weight="500">
      "Architecting autonomous AI workflows and resilient enterprise platforms that bridge theory into production impact."
    </text>
  </g>
</svg>
